<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Servisní mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
#map { height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map').setView([50.0755, 14.4378], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

// jednoduchý příklad bodu
L.marker([50.0755, 14.4378]).addTo(map)
    .bindPopup('Test bod');
</script>
</body>
</html>
