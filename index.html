<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<title>Servisní mapa FZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }
#panel {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:8px;
  z-index:1000;
}
</style>
</head>
<body>

<div id="panel">
<button onclick="geocode()">Doplnit GPS z adres</button>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([49.8,15.5],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let data = [];

Papa.parse("data.csv", {
  download: true,
  header: true,
  complete: function(results) {
    data = results.data;
  }
});

function geocode(){
  alert("Tady poběží dopočítání GPS – zatím základní verze 👍");
}
</script>

</body>
</html>
