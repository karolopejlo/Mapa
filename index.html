<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servisní mapa záložních zdrojů</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ1Vgrkj5nf91CdCxLl7ZyMQp0zcgAw=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --red: #dc2626;
      --orange: #f97316;
      --yellow: #eab308;
      --green: #16a34a;
      --blue: #2563eb;
      --gray: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
    aside { overflow: auto; background: var(--card); border-right: 1px solid var(--border); padding: 16px; }
    #map { height: 100vh; width: 100%; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .subtitle { color: var(--muted); font-size: 13px; line-height: 1.35; margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
    input, select, button {
      width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px;
      background: white; font-size: 14px;
    }
    button { cursor: pointer; font-weight: 700; }
    .primary { background: var(--blue); color: white; border-color: var(--blue); }
    .secondary { background: #f1f5f9; }
    .danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .stat { border: 1px solid var(--border); border-radius: 14px; padding: 10px; background: #fff; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .legend { display: grid; gap: 6px; margin: 10px 0 14px; font-size: 13px; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; border: 2px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
    .list { display: grid; gap: 8px; margin-top: 10px; }
    .item { border: 1px solid var(--border); border-radius: 14px; padding: 10px; background: white; cursor: pointer; }
    .item:hover { border-color: #93c5fd; background: #eff6ff; }
    .item-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .item-meta { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .pill { display: inline-block; padding: 3px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 6px; }
    .pill.red { background: #fee2e2; color: #991b1b; }
    .pill.orange { background: #ffedd5; color: #9a3412; }
    .pill.yellow { background: #fef9c3; color: #854d0e; }
    .pill.green { background: #dcfce7; color: #166534; }
    .pill.gray { background: #f1f5f9; color: #334155; }
    .popup h3 { margin: 0 0 6px; font-size: 15px; }
    .popup table { border-collapse: collapse; font-size: 12px; }
    .popup td { vertical-align: top; padding: 3px 0; }
    .popup td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
    .notice { border: 1px solid #fde68a; background: #fffbeb; color: #92400e; padding: 10px; border-radius: 12px; font-size: 13px; line-height: 1.35; margin: 10px 0; }
    .progress { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 18px; }
    @media (max-width: 850px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 48vh 52vh; }
      aside { order: 2; border-right: none; border-top: 1px solid var(--border); }
      #map { order: 1; height: 48vh; }
    }
  
#detailTable td:first-child{font-weight:700;color:#334155;width:180px}
#detailTable td:nth-child(2){word-break:break-word}

</style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Servisní mapa FZ</h1>
      <div class="subtitle">
        Barevná mapa kontrol záložních zdrojů. Data se načítají ze souboru <b>data.csv</b>.
      </div>

      <div class="notice" id="gpsNotice">
        Některé záznamy nemají GPS. Klikni na <b>Doplnit GPS z adres</b>.
        Souřadnice se uloží do tohoto prohlížeče.
      </div>

      <button class="primary" id="geocodeBtn">Doplnit GPS z adres</button>
      <div class="progress" id="progress"></div>

      <label>Hledat</label>
      <input id="search" placeholder="adresa, zdroj, kontakt..." />

      <div class="row">
        <div>
          <label>Stav</label>
          <select id="statusFilter">
            <option value="">Vše</option>
          </select>
        </div>
        <div>
          <label>Kraj</label>
          <select id="regionFilter">
            <option value="">Vše</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:8px">
        <button class="secondary" id="fitBtn">Přiblížit na body</button>
        <button class="danger" id="clearGpsBtn">Vymazat uložené GPS</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="totalCount">0</b><span>zobrazeno</span></div>
        <div class="stat"><b id="urgentCount">0</b><span>po termínu / urgentní</span></div>
      </div>

      <div class="legend">
        <div><span class="dot" style="background:var(--red)"></span> Po termínu / méně než 7 dní</div>
        <div><span class="dot" style="background:var(--orange)"></span> 7–30 dní</div>
        <div><span class="dot" style="background:var(--yellow)"></span> 30–60 dní</div>
        <div><span class="dot" style="background:var(--green)"></span> Více než 60 dní</div>
      </div>

      <div class="list" id="list"></div>
    </aside>

    <div id="map"></div>
  </div>

<script>
const CSV_FILE = "data.csv";
const GPS_STORAGE_KEY = "fz-servisni-mapa-gps-v1";

const colors = {
  "červená": "#dc2626",
  "cervena": "#dc2626",
  "oranžová": "#f97316",
  "oranzova": "#f97316",
  "žlutá": "#eab308",
  "zluta": "#eab308",
  "zelená": "#16a34a",
  "zelena": "#16a34a"
};

const map = L.map("map").setView([49.8, 15.5], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

let rawRows = [];
let rows = [];
let markers = L.layerGroup().addTo(map);
let markerById = new Map();

function safe(v) {
  return String(v ?? "").trim();
}

function rowId(row, index) {
  const key = [
    safe(row["Řádek v původním Excelu"]),
    safe(row["Adresa / umístění"]),
    safe(row["Zdroj"])
  ].join("|");
  return btoa(unescape(encodeURIComponent(key))).replace(/=/g, "") || String(index);
}

function getStoredGps() {
  try { return JSON.parse(localStorage.getItem(GPS_STORAGE_KEY) || "{}"); }
  catch { return {}; }
}

function setStoredGps(obj) {
  localStorage.setItem(GPS_STORAGE_KEY, JSON.stringify(obj));
}

function parseNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function normalizeRows(data) {
  const saved = getStoredGps();
  return data.map((r, idx) => {
    const id = rowId(r, idx);
    const savedGps = saved[id];
    let lat = parseNum(r["GPS_lat"]);
    let lon = parseNum(r["GPS_lon"]);
    if ((lat === null || lon === null) && savedGps) {
      lat = savedGps.lat;
      lon = savedGps.lon;
    }
    return {
      id,
      index: idx,
      kraj: safe(r["Kraj"]),
      adresa: safe(r["Adresa / umístění"]),
      zdroj: safe(r["Zdroj"]),
      kontakt: safe(r["Kontakt"]),
      posledni: safe(r["Poslední proběhlá kontrola"]),
      pristi: safe(r["Příští plánovaná kontrola"]),
      dni: safe(r["Dní do kontroly"]),
      stav: safe(r["Stav pro mapu"]),
      barva: safe(r["Barva bodu"]),
      poznamky: safe(r["Poznámky"]),
      lat, lon,
      raw: r
    };
  });
}

function colorFor(row) {
  const key = row.barva.toLowerCase();
  if (colors[key]) return colors[key];

  const dni = Number(row.dni);
  if (!Number.isFinite(dni) || dni < 7) return colors["červená"];
  if (dni < 30) return colors["oranžová"];
  if (dni < 60) return colors["žlutá"];
  return colors["zelená"];
}

function pillClass(row) {
  const c = colorFor(row);
  if (c === colors["červená"]) return "red";
  if (c === colors["oranžová"]) return "orange";
  if (c === colors["žlutá"]) return "yellow";
  if (c === colors["zelená"]) return "green";
  return "gray";
}

function hasGps(row) {
  return Number.isFinite(row.lat) && Number.isFinite(row.lon);
}

function popupHtml(row) {
  const title = row.adresa || row.zdroj || "Záznam";
  return `<div class="popup">
    <h3>${escapeHtml(title)}</h3>
    <table>
      <tr><td>Zdroj</td><td>${escapeHtml(row.zdroj)}</td></tr>
      <tr><td>Kraj</td><td>${escapeHtml(row.kraj)}</td></tr>
      <tr><td>Kontakt</td><td>${escapeHtml(row.kontakt)}</td></tr>
      <tr><td>Poslední kontrola</td><td>${escapeHtml(row.posledni)}</td></tr>
      <tr><td>Příští kontrola</td><td><b>${escapeHtml(row.pristi)}</b></td></tr>
      <tr><td>Dní do kontroly</td><td>${escapeHtml(row.dni)}</td></tr>
      <tr><td>Stav</td><td>${escapeHtml(row.stav)}</td></tr>
      <tr><td>Poznámky</td><td>${escapeHtml(row.poznamky)}</td></tr>
    </table>
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function filters() {
  return {
    q: safe(document.getElementById("search").value).toLowerCase(),
    status: safe(document.getElementById("statusFilter").value),
    region: safe(document.getElementById("regionFilter").value)
  };
}

function filteredRows() {
  const f = filters();
  return rows.filter(r => {
    if (f.status && r.stav !== f.status) return false;
    if (f.region && r.kraj !== f.region) return false;
    if (f.q) {
      const hay = [r.adresa, r.zdroj, r.kontakt, r.kraj, r.stav, r.poznamky].join(" ").toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });
}

function render() {
  markers.clearLayers();
  markerById.clear();

  const list = document.getElementById("list");
  list.innerHTML = "";

  const visible = filteredRows();
  const withGps = visible.filter(hasGps);

  for (const row of withGps) {
    const marker = L.circleMarker([row.lat, row.lon], {
      radius: 8,
      fillColor: colorFor(row),
      color: "#ffffff",
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).bindPopup(popupHtml(row));
    marker.addTo(markers);
    markerById.set(row.id, marker);
  }

  const sorted = [...visible].sort((a,b) => {
    const da = Number(a.dni), db = Number(b.dni);
    const aa = Number.isFinite(da) ? da : 99999;
    const bb = Number.isFinite(db) ? db : 99999;
    return aa - bb;
  });

  for (const row of sorted.slice(0, 100)) {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-title">${escapeHtml(row.adresa || row.zdroj || "Bez názvu")}</div>
      <div class="item-meta">
        ${escapeHtml(row.zdroj)}<br>
        Příští kontrola: <b>${escapeHtml(row.pristi || "není vyplněno")}</b>
        ${row.dni ? ` · ${escapeHtml(row.dni)} dní` : ""}
      </div>
      <span class="pill ${pillClass(row)}">${escapeHtml(row.stav || row.barva || "bez stavu")}</span>
    `;
    div.onclick = () => {
      const m = markerById.get(row.id);
      if (m) {
        map.setView(m.getLatLng(), 13);
        m.openPopup();
      } else {
        alert("Tento záznam zatím nemá GPS souřadnice. Klikni na Doplnit GPS z adres.");
      }
    };
    list.appendChild(div);
  }

  document.getElementById("totalCount").textContent = String(visible.length);
  document.getElementById("urgentCount").textContent =
    String(visible.filter(r => colorFor(r) === colors["červená"]).length);

  const missing = rows.filter(r => !hasGps(r)).length;
  document.getElementById("gpsNotice").style.display = missing ? "block" : "none";
  document.getElementById("progress").textContent = missing
    ? `Bez GPS: ${missing} záznamů. Na mapě se zatím zobrazí jen body se souřadnicemi.`
    : `GPS jsou doplněné pro všechny dostupné záznamy.`;
}

function populateFilters() {
  const statusSel = document.getElementById("statusFilter");
  const regionSel = document.getElementById("regionFilter");

  const statuses = [...new Set(rows.map(r => r.stav).filter(Boolean))].sort();
  const regions = [...new Set(rows.map(r => r.kraj).filter(Boolean))].sort();

  for (const s of statuses) {
    const o = document.createElement("option"); o.value = s; o.textContent = s; statusSel.appendChild(o);
  }
  for (const k of regions) {
    const o = document.createElement("option"); o.value = k; o.textContent = k; regionSel.appendChild(o);
  }
}

function fitToMarkers() {
  const pts = filteredRows().filter(hasGps).map(r => [r.lat, r.lon]);
  if (!pts.length) return;
  map.fitBounds(pts, {padding: [30,30]});
}

async function geocodeAll() {
  const btn = document.getElementById("geocodeBtn");
  const progress = document.getElementById("progress");
  btn.disabled = true;
  btn.textContent = "Dohledávám GPS...";

  const saved = getStoredGps();
  const missing = rows.filter(r => !hasGps(r) && r.adresa);
  let done = 0, found = 0;

  for (const row of missing) {
    done++;
    progress.textContent = `Dohledávám ${done}/${missing.length}: ${row.adresa}`;
    try {
      const q = `${row.adresa}, Česká republika`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&q=${encodeURIComponent(q)}`;
      const res = await fetch(url, { headers: { "Accept": "application/json" }});
      const json = await res.json();
      if (json && json[0]) {
        row.lat = Number(json[0].lat);
        row.lon = Number(json[0].lon);
        saved[row.id] = {lat: row.lat, lon: row.lon, label: row.adresa};
        found++;
        setStoredGps(saved);
        render();
      }
    } catch (e) {
      console.warn("Geocode failed", row.adresa, e);
    }
    // Nominatim public service: keep requests gentle
    await new Promise(resolve => setTimeout(resolve, 1100));
  }

  btn.disabled = false;
  btn.textContent = "Doplnit GPS z adres";
  progress.textContent = `Hotovo. Dohledáno ${found} z ${missing.length} chybějících GPS.`;
  render();
  fitToMarkers();
}

function clearGps() {
  if (!confirm("Opravdu vymazat GPS uložené v tomto prohlížeči?")) return;
  localStorage.removeItem(GPS_STORAGE_KEY);
  rows = normalizeRows(rawRows);
  render();
}

Papa.parse(CSV_FILE, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: results => {
    rawRows = results.data;
    rows = normalizeRows(rawRows);
    populateFilters();
    render();
    fitToMarkers();
  },
  error: err => {
    document.getElementById("progress").textContent = "Nepodařilo se načíst data.csv: " + err;
  }
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("statusFilter").addEventListener("change", render);
document.getElementById("regionFilter").addEventListener("change", render);
document.getElementById("fitBtn").addEventListener("click", fitToMarkers);
document.getElementById("geocodeBtn").addEventListener("click", geocodeAll);
document.getElementById("clearGpsBtn").addEventListener("click", clearGps);
</script>
</body>
</html>
