<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servisní mapa FZ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}.app{display:grid;grid-template-columns:390px 1fr;height:100vh}aside{overflow:auto;background:#fff;border-right:1px solid #e2e8f0;padding:16px}#map{height:100vh}h1{font-size:20px;margin:0 0 8px}.small{font-size:13px;color:#64748b;line-height:1.35}.box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px;font-size:13px;margin:10px 0}.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}label{display:block;font-size:12px;color:#64748b;margin:10px 0 4px}input,select,button{width:100%;padding:9px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font-size:14px}button{cursor:pointer;font-weight:700}.primary{background:#2563eb;color:white;border-color:#2563eb}.secondary{background:#f1f5f9}.danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{border:1px solid #e2e8f0;border-radius:14px;padding:10px;background:#fff}.stat b{display:block;font-size:21px}.stat span{color:#64748b;font-size:12px}.legend{display:grid;gap:6px;margin:10px 0;font-size:13px}.legend div{display:flex;gap:8px;align-items:center}.dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:2px solid white;box-shadow:0 0 0 1px rgba(0,0,0,.25)}.item{border:1px solid #e2e8f0;border-radius:14px;padding:10px;background:white;cursor:pointer;margin-bottom:8px}.item:hover{background:#eff6ff;border-color:#93c5fd}.item-title{font-weight:700;font-size:13px;margin-bottom:4px}.item-meta{font-size:12px;color:#64748b;line-height:1.35}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;margin-top:6px}.red{background:#fee2e2;color:#991b1b}.orange{background:#ffedd5;color:#9a3412}.yellow{background:#fef9c3;color:#854d0e}.green{background:#dcfce7;color:#166534}.gray{background:#f1f5f9;color:#334155}.popup h3{margin:0 0 6px;font-size:15px}.popup table{border-collapse:collapse;font-size:12px}.popup td{padding:3px 0;vertical-align:top}.popup td:first-child{color:#64748b;padding-right:8px;white-space:nowrap}@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:48vh 52vh}#map{height:48vh}aside{order:2;border-right:0;border-top:1px solid #e2e8f0}}
</style>
</head>
<body>
<div class="app"><aside>
<h1>Servisní mapa FZ</h1>
<p class="small">Data se načítají ze souboru <b>data.csv</b>. GPS se uloží do prohlížeče.</p>
<div id="gpsBox" class="box">Načítám data...</div>
<button class="primary" id="geocodeBtn">Doplnit GPS z adres</button>
<div class="row" style="margin-top:8px"><button class="secondary" id="exportBtn">Exportovat CSV s GPS</button><button class="danger" id="clearBtn">Vymazat GPS</button></div>
<p id="progress" class="small"></p>
<label>Hledat</label><input id="search" placeholder="adresa, zdroj, kontakt...">
<div class="row"><div><label>Stav</label><select id="statusFilter"><option value="">Vše</option></select></div><div><label>Kraj</label><select id="regionFilter"><option value="">Vše</option></select></div></div>
<button class="secondary" id="fitBtn" style="margin-top:8px">Přiblížit na body</button>
<div class="stats"><div class="stat"><b id="shownCount">0</b><span>zobrazeno</span></div><div class="stat"><b id="gpsCount">0</b><span>s GPS</span></div></div>
<div class="legend"><div><span class="dot" style="background:#dc2626"></span> Po termínu / méně než 7 dní</div><div><span class="dot" style="background:#f97316"></span> 7-30 dní</div><div><span class="dot" style="background:#eab308"></span> 30-60 dní</div><div><span class="dot" style="background:#16a34a"></span> Více než 60 dní</div></div>
<div id="list"></div>
</aside><div id="map"></div></div>
<script>
const CSV_FILE="data.csv", STORAGE_KEY="fz_mapa_gps_cache_v4";
let originalData=[], rows=[], cache=loadCache(), layer, markerById=new Map();
const map=L.map("map").setView([49.8,15.5],7);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);layer=L.layerGroup().addTo(map);
function safe(v){return String(v??"").trim()}function parseNum(v){if(v===null||v===undefined||v==="")return null;const n=Number(String(v).replace(",","."));return Number.isFinite(n)?n:null}function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function idFor(r,i){const raw=[safe(r["Řádek v původním Excelu"]),safe(r["Adresa / umístění"]),safe(r["Zdroj"])].join("|");return btoa(unescape(encodeURIComponent(raw))).replaceAll("=","")||String(i)}function loadCache(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return{}}}function saveCache(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cache))}
function normalize(data){return data.map((r,i)=>{const id=idFor(r,i), c=cache[id];let lat=parseNum(r["GPS_lat"]), lon=parseNum(r["GPS_lon"]);if((!Number.isFinite(lat)||!Number.isFinite(lon))&&c){lat=c.lat;lon=c.lon}return{id,i,raw:r,kraj:safe(r["Kraj"]),adresa:safe(r["Adresa / umístění"]),zdroj:safe(r["Zdroj"]),kontakt:safe(r["Kontakt"]),posledni:safe(r["Poslední proběhlá kontrola"]),pristi:safe(r["Příští plánovaná kontrola"]),dni:safe(r["Dní do kontroly"]),stav:safe(r["Stav pro mapu"]),barva:safe(r["Barva bodu"]),poznamky:safe(r["Poznámky"]),lat,lon}})}
function hasGps(r){return Number.isFinite(r.lat)&&Number.isFinite(r.lon)}function color(r){const b=r.barva.toLowerCase();if(b.includes("červen")||b.includes("cerven"))return"#dc2626";if(b.includes("oran"))return"#f97316";if(b.includes("žlut")||b.includes("zlut"))return"#eab308";if(b.includes("zelen"))return"#16a34a";const d=Number(r.dni);if(!Number.isFinite(d)||d<7)return"#dc2626";if(d<30)return"#f97316";if(d<60)return"#eab308";return"#16a34a"}function pillClass(r){const c=color(r);return c==="#dc2626"?"red":c==="#f97316"?"orange":c==="#eab308"?"yellow":c==="#16a34a"?"green":"gray"}
function popup(r){return`<div class="popup"><h3>${esc(r.adresa||r.zdroj||"Záznam")}</h3><table><tr><td>Zdroj</td><td>${esc(r.zdroj)}</td></tr><tr><td>Kraj</td><td>${esc(r.kraj)}</td></tr><tr><td>Kontakt</td><td>${esc(r.kontakt)}</td></tr><tr><td>Poslední kontrola</td><td>${esc(r.posledni)}</td></tr><tr><td>Příští kontrola</td><td><b>${esc(r.pristi)}</b></td></tr><tr><td>Dní do kontroly</td><td>${esc(r.dni)}</td></tr><tr><td>Stav</td><td>${esc(r.stav)}</td></tr><tr><td>Poznámky</td><td>${esc(r.poznamky)}</td></tr><tr><td>GPS</td><td>${hasGps(r)?r.lat.toFixed(6)+", "+r.lon.toFixed(6):"chybí"}</td></tr></table></div>`}
function currentFilter(){return{q:safe(document.getElementById("search").value).toLowerCase(),s:safe(document.getElementById("statusFilter").value),k:safe(document.getElementById("regionFilter").value)}}function filtered(){const f=currentFilter();return rows.filter(r=>{if(f.s&&r.stav!==f.s)return false;if(f.k&&r.kraj!==f.k)return false;if(f.q){const hay=[r.adresa,r.zdroj,r.kontakt,r.kraj,r.stav,r.poznamky].join(" ").toLowerCase();if(!hay.includes(f.q))return false}return true})}
function render(){layer.clearLayers();markerById.clear();const visible=filtered(), withGps=visible.filter(hasGps);withGps.forEach(r=>{const m=L.circleMarker([r.lat,r.lon],{radius:8,color:"#fff",weight:2,fillColor:color(r),fillOpacity:.9}).bindPopup(popup(r)).addTo(layer);markerById.set(r.id,m)});const list=document.getElementById("list");list.innerHTML="";visible.slice().sort((a,b)=>{const da=Number(a.dni),db=Number(b.dni);return(Number.isFinite(da)?da:999999)-(Number.isFinite(db)?db:999999)}).slice(0,120).forEach(r=>{const div=document.createElement("div");div.className="item";div.innerHTML=`<div class="item-title">${esc(r.adresa||r.zdroj||"Bez názvu")}</div><div class="item-meta">${esc(r.zdroj)}<br>Příští kontrola: <b>${esc(r.pristi||"není vyplněno")}</b>${r.dni?" · "+esc(r.dni)+" dní":""}</div><span class="pill ${pillClass(r)}">${esc(r.stav||r.barva||"bez stavu")}</span>`;div.onclick=()=>{const m=markerById.get(r.id);if(m){map.setView(m.getLatLng(),13);m.openPopup()}else alert("Tento záznam zatím nemá GPS. Klikni na Doplnit GPS z adres.")};list.appendChild(div)});document.getElementById("shownCount").textContent=visible.length;document.getElementById("gpsCount").textContent=rows.filter(hasGps).length;const missing=rows.filter(r=>!hasGps(r)).length, box=document.getElementById("gpsBox");if(missing){box.className="box";box.innerHTML=`Chybí GPS u <b>${missing}</b> záznamů. Klikni na <b>Doplnit GPS z adres</b>.`}else{box.className="box ok";box.innerHTML="GPS jsou doplněné. Klikni na <b>Exportovat CSV s GPS</b> a nahraj nový data.csv na GitHub."}}
function populateFilters(){for(const id of ["statusFilter","regionFilter"])document.getElementById(id).innerHTML='<option value="">Vše</option>';[...new Set(rows.map(r=>r.stav).filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;document.getElementById("statusFilter").appendChild(o)});[...new Set(rows.map(r=>r.kraj).filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;document.getElementById("regionFilter").appendChild(o)})}function fit(){const pts=filtered().filter(hasGps).map(r=>[r.lat,r.lon]);if(pts.length)map.fitBounds(pts,{padding:[30,30]})}
async function geocodeAll(){const missing=rows.filter(r=>!hasGps(r)&&r.adresa);if(!missing.length){alert("GPS už jsou doplněné.");return}const btn=document.getElementById("geocodeBtn"),p=document.getElementById("progress");btn.disabled=true;let found=0,failed=0;for(let i=0;i<missing.length;i++){const r=missing[i];p.textContent=`Dohledávám ${i+1}/${missing.length}: ${r.adresa}`;const queries=[`${r.adresa}, Česká republika`,`${r.adresa}, ${r.kraj}, Česká republika`];let ok=false;for(const q of queries){try{const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&q="+encodeURIComponent(q);const res=await fetch(url,{headers:{"Accept":"application/json"}});const js=await res.json();if(js&&js[0]){r.lat=Number(js[0].lat);r.lon=Number(js[0].lon);cache[r.id]={lat:r.lat,lon:r.lon,address:r.adresa};saveCache();found++;ok=true;render();break}}catch(e){console.warn(e)}await new Promise(resolve=>setTimeout(resolve,1200))}if(!ok)failed++;await new Promise(resolve=>setTimeout(resolve,1200))}btn.disabled=false;p.textContent=`Hotovo. Doplněno: ${found}, nenalezeno: ${failed}.`;render();fit()}
function csvEscape(v){const s=String(v??"");return/[",\n;]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}function exportCsv(){const headers=Object.keys(originalData[0]||{});if(!headers.includes("GPS_lat"))headers.push("GPS_lat");if(!headers.includes("GPS_lon"))headers.push("GPS_lon");const lines=[headers.map(csvEscape).join(";")];rows.forEach(r=>{const obj={...r.raw,GPS_lat:hasGps(r)?r.lat:"",GPS_lon:hasGps(r)?r.lon:""};lines.push(headers.map(h=>csvEscape(obj[h])).join(";"))});const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.csv";a.click();URL.revokeObjectURL(a.href)}function clearGps(){if(!confirm("Opravdu vymazat uložené GPS v tomto prohlížeči?"))return;localStorage.removeItem(STORAGE_KEY);cache={};rows=normalize(originalData);render()}
Papa.parse(CSV_FILE,{download:true,header:true,skipEmptyLines:true,complete:res=>{originalData=res.data;rows=normalize(originalData);populateFilters();render();fit()},error:err=>{document.getElementById("progress").textContent="Nepodařilo se načíst data.csv: "+err}});
document.getElementById("search").addEventListener("input",render);document.getElementById("statusFilter").addEventListener("change",render);document.getElementById("regionFilter").addEventListener("change",render);document.getElementById("fitBtn").addEventListener("click",fit);document.getElementById("geocodeBtn").addEventListener("click",geocodeAll);document.getElementById("exportBtn").addEventListener("click",exportCsv);document.getElementById("clearBtn").addEventListener("click",clearGps);
</script>

<script>
/* Skryj pravý panel po kliknutí na bod v mapě */
(function(){
  function hideDrawerOnMapPointClick(){
    const drawer=document.getElementById("drawer");
    if(!drawer) return;

    document.querySelectorAll(".leaflet-marker-icon, .leaflet-interactive").forEach(el=>{
      if(el.__hideDrawerBound) return;
      el.__hideDrawerBound=true;

      el.addEventListener("click", function(){
        setTimeout(()=>{
          drawer.classList.remove("open");
          drawer.style.display="none";

          setTimeout(()=>{
            drawer.style.display="";
          },50);
        },10);
      }, true);
    });
  }

  document.addEventListener("DOMContentLoaded", hideDrawerOnMapPointClick);
  setInterval(hideDrawerOnMapPointClick, 1500);
})();
</script>


<script>
/* Jemná oprava tlačítka Zavřít v detail panelu */
(function(){
  function closeDetailDrawer(){
    const drawer=document.getElementById("drawer");
    if(!drawer) return;
    drawer.classList.remove("open");
  }

  function bindDetailClose(){
    document.querySelectorAll("#drawer button, #drawer .x").forEach(btn=>{
      const t=(btn.textContent||"").trim().toLowerCase();
      if(t==="zavřít" || t==="zavrit"){
        if(btn.__closeOnlyFixed) return;
        btn.__closeOnlyFixed=true;
        btn.addEventListener("click",function(e){
          e.preventDefault();
          e.stopPropagation();
          closeDetailDrawer();
        });
      }
    });
  }

  document.addEventListener("DOMContentLoaded",bindDetailClose);
  document.addEventListener("click",function(e){
    const btn=e.target.closest && e.target.closest("#drawer button, #drawer .x");
    if(!btn) return;
    const t=(btn.textContent||"").trim().toLowerCase();
    if(t==="zavřít" || t==="zavrit"){
      e.preventDefault();
      e.stopPropagation();
      closeDetailDrawer();
    }
  },true);

  setInterval(bindDetailClose,1000);
})();
</script>

</body>
</html>
